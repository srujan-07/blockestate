# ConfigTX configuration for Land Registry custom network
# Defines organizations, consortiums, and channel policies
# PRODUCTION-GRADE MULTI-ORG SETUP

Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/orderer.landregistry.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  # Central Common Land Base (CCLB) - Root Authority
  - &CCLB
    Name: CCLB
    ID: CCLBMSP
    MSPDir: crypto-config/peerOrganizations/cclb.landregistry.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('CCLBMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('CCLBMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('CCLBMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('CCLBMSP.peer')"
    AnchorPeers:
      - Host: peer0.cclb.landregistry.local
        Port: 7051

  # State Organizations
  - &StateOrgTS
    Name: StateOrgTS
    ID: StateOrgTSMSP
    MSPDir: crypto-config/peerOrganizations/ts.landregistry.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('StateOrgTSMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('StateOrgTSMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('StateOrgTSMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('StateOrgTSMSP.peer')"
    AnchorPeers:
      - Host: peer0.ts.landregistry.local
        Port: 7051

  - &StateOrgKA
    Name: StateOrgKA
    ID: StateOrgKAMSP
    MSPDir: crypto-config/peerOrganizations/ka.landregistry.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('StateOrgKAMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('StateOrgKAMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('StateOrgKAMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('StateOrgKAMSP.peer')"
    AnchorPeers:
      - Host: peer0.ka.landregistry.local
        Port: 8051

  - &StateOrgAP
    Name: StateOrgAP
    ID: StateOrgAPMSP
    MSPDir: crypto-config/peerOrganizations/ap.landregistry.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('StateOrgAPMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('StateOrgAPMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('StateOrgAPMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('StateOrgAPMSP.peer')"
    AnchorPeers:
      - Host: peer0.ap.landregistry.local
        Port: 9051

  # Village Revenue Officer Organization
  - &VROOrg
    Name: VROOrg
    ID: VROOrgMSP
    MSPDir: crypto-config/peerOrganizations/vro.landregistry.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('VROOrgMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('VROOrgMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('VROOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('VROOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.vro.landregistry.local
        Port: 10051

  # Mandal Revenue Officer Organization (PBFT Consensus)
  - &MROOrg
    Name: MROOrg
    ID: MROOrgMSP
    MSPDir: crypto-config/peerOrganizations/mro.landregistry.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('MROOrgMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('MROOrgMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('MROOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('MROOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.mro.landregistry.local
        Port: 11051

  # Admin Organization (System Administration)
  - &AdminOrg
    Name: AdminOrg
    ID: AdminOrgMSP
    MSPDir: crypto-config/peerOrganizations/admin.landregistry.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('AdminOrgMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('AdminOrgMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('AdminOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('AdminOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.admin.landregistry.local
        Port: 12051

  # Citizen Organization
  - &CitizenOrg
    Name: CitizenOrg
    ID: CitizenOrgMSP
    MSPDir: crypto-config/peerOrganizations/citizen.landregistry.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('CitizenOrgMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('CitizenOrgMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('CitizenOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('CitizenOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.citizen.landregistry.local
        Port: 13051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Members"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Members"
    Admins:
      Type: ImplicitMeta
      Rule: "ANY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Members"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Members"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: solo
  Addresses:
    - orderer0.orderer.landregistry.local:7050
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 500
    AbsoluteMaxBytes: 10485760
    PreferredMaxBytes: 2097152
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Members"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Members"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Members"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Members"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Members"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  # Genesis block for orderer
  LandRegistryOrdererGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities:
        <<: *OrdererCapabilities
    Consortiums:
      LandRegistryConsortium:
        Organizations:
          - *CCLB
          - *StateOrgTS
          - *StateOrgKA
          - *StateOrgAP
          - *VROOrg
          - *MROOrg
          - *AdminOrg
          - *CitizenOrg
    Capabilities:
      <<: *ChannelCapabilities

  # CCLB Global Channel - Property ID Registry (All states access)
  CCLBGlobalChannel:
    Consortium: LandRegistryConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *CCLB
        - *StateOrgTS
        - *StateOrgKA
        - *StateOrgAP
        - *AdminOrg
      Policies:
        # CCLB-only write for Property IDs
        Writers:
          Type: Signature
          Rule: "OR('CCLBMSP.member', 'AdminOrgMSP.admin')"
        Readers:
          Type: ImplicitMeta
          Rule: "ANY Members"
        Admins:
          Type: ImplicitMeta
          Rule: "ANY Admins"
        # Property ID issuance requires CCLB endorsement
        LifecycleEndorsement:
          Type: Signature
          Rule: "AND('CCLBMSP.peer')"
        Endorsement:
          Type: Signature
          Rule: "AND('CCLBMSP.peer')"
      Capabilities:
        <<: *ApplicationCapabilities

  # Regional Channel - Telangana State (TS)
  LandRegionTS:
    Consortium: LandRegistryConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *CCLB
        - *StateOrgTS
        - *VROOrg
        - *MROOrg
        - *AdminOrg
        - *CitizenOrg
      Policies:
        Readers:
          Type: ImplicitMeta
          Rule: "ANY Members"
        Writers:
          Type: ImplicitMeta
          Rule: "ANY Members"
        Admins:
          Type: ImplicitMeta
          Rule: "ANY Admins"
        # VRO verification + MRO approval required
        LifecycleEndorsement:
          Type: Signature
          Rule: "OR('CCLBMSP.peer', 'StateOrgTSMSP.peer', 'VROOrgMSP.peer', 'MROOrgMSP.peer')"
        Endorsement:
          Type: Signature
          Rule: "OR('StateOrgTSMSP.peer', 'VROOrgMSP.peer', 'MROOrgMSP.peer')"
      Capabilities:
        <<: *ApplicationCapabilities

  # Regional Channel - Karnataka State (KA)
  LandRegionKA:
    Consortium: LandRegistryConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *CCLB
        - *StateOrgKA
        - *VROOrg
        - *MROOrg
        - *AdminOrg
        - *CitizenOrg
      Policies:
        Readers:
          Type: ImplicitMeta
          Rule: "ANY Members"
        Writers:
          Type: ImplicitMeta
          Rule: "ANY Members"
        Admins:
          Type: ImplicitMeta
          Rule: "ANY Admins"
        LifecycleEndorsement:
          Type: Signature
          Rule: "OR('CCLBMSP.peer', 'StateOrgKAMSP.peer', 'VROOrgMSP.peer', 'MROOrgMSP.peer')"
        Endorsement:
          Type: Signature
          Rule: "OR('StateOrgKAMSP.peer', 'VROOrgMSP.peer', 'MROOrgMSP.peer')"
      Capabilities:
        <<: *ApplicationCapabilities

  # Regional Channel - Andhra Pradesh (AP)
  LandRegionAP:
    Consortium: LandRegistryConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *CCLB
        - *StateOrgAP
        - *VROOrg
        - *MROOrg
        - *AdminOrg
        - *CitizenOrg
      Policies:
        Readers:
          Type: ImplicitMeta
          Rule: "ANY Members"
        Writers:
          Type: ImplicitMeta
          Rule: "ANY Members"
        Admins:
          Type: ImplicitMeta
          Rule: "ANY Admins"
        LifecycleEndorsement:
          Type: Signature
          Rule: "OR('CCLBMSP.peer', 'StateOrgAPMSP.peer', 'VROOrgMSP.peer', 'MROOrgMSP.peer')"
        Endorsement:
          Type: Signature
          Rule: "OR('StateOrgAPMSP.peer', 'VROOrgMSP.peer', 'MROOrgMSP.peer')"
      Capabilities:
        <<: *ApplicationCapabilities


